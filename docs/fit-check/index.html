<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="A few quick questions to see if itseli and your food business are a fit.">
<title>Let's see if we're a fit · itseli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Style 2 (Clean). One fixed screen, mobile first. A clean home with one button, then a fit check:
   one question per screen, tap an answer or tick boxes, a progress bar by section, and a result at the end.
   White screens, bold black type, flat blue drawings with black outlines, mint and pink accents, black pills. */
:root{
  --bg:#EFEFEF; --white:#FFFFFF; --ink:#111111; --grey:#6B6B6B; --line:#E6E6E6; --soft:#F6F6F6;
  --blue:#2F5BFF; --mint:#3DDC97; --pink:#F2A9A0; --warn:#9A5B12; --warn-bg:#FFF4E2;
  --f:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
h1,h2,p,ul{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:14px}
[tabindex="-1"]:focus{outline:none}

.stage{height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.app{flex:1;min-height:0;width:100%;max-width:1180px;background:var(--white);border-radius:32px;overflow:hidden;box-shadow:0 30px 70px -40px rgb(0 0 0 / 35%);display:flex;flex-direction:column}
@media (max-width:560px){.app{border-radius:24px}}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;border:0;background:transparent;cursor:pointer;padding:0}
.mark i{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#FFFFFF;font-style:normal;font-size:11px;display:grid;place-items:center}
.link{border:0;background:transparent;cursor:pointer;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px 0}

/* buttons */
.btn{border:0;cursor:pointer;height:54px;padding:0 28px;border-radius:999px;background:var(--ink);color:#FFFFFF;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:10px;white-space:nowrap;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:#BDBDBD;cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line)}
.btn svg{width:18px;height:18px}

/* home */
.home{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:24px;padding:0 clamp(22px,5vw,72px) clamp(22px,4vw,48px)}
.home h1{font-size:clamp(34px,4.4vw,60px);line-height:1.04;font-weight:800;letter-spacing:-.04em;text-wrap:balance}
.home .sub{font-size:clamp(17px,1.5vw,20px);color:var(--grey);margin-top:16px;max-width:30ch}
.home .ctas{display:flex;align-items:center;gap:18px;margin-top:34px;flex-wrap:wrap}
.home .meta{font-size:14px;color:var(--grey)}
.home .art{height:min(56vh,460px)}
.home .art svg{width:100%;height:100%}
.home .what{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.home .what span{font-size:13px;font-weight:600;height:32px;padding:0 12px;border-radius:999px;background:var(--soft);display:inline-flex;align-items:center}
@media (max-width:820px){.home{grid-template-columns:1fr;align-content:center;text-align:left}.home .art{order:-1;height:30vh}}

/* question screen */
.q{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:620px;margin:0 auto;padding:0 22px 22px}
.prog{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.prog i{height:5px;border-radius:5px;background:var(--line);overflow:hidden;position:relative}
.prog i b{position:absolute;inset:0;background:var(--ink);transform-origin:left;transition:transform .35s ease}
.sec{display:flex;justify-content:space-between;font-size:13px;color:var(--grey);margin-top:10px;font-weight:600}
.qart{height:120px;margin:14px 0 6px;display:flex;justify-content:center}
.qart svg{height:100%;width:auto}
.q h2{font-size:clamp(23px,2.6vw,30px);line-height:1.15;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.q .help{font-size:15px;color:var(--grey);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px;overflow:auto;min-height:0;padding:2px}
.opt{width:100%;text-align:left;cursor:pointer;border-radius:18px;border:1.5px solid var(--line);background:var(--soft);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:16px;transition:border-color .15s ease,background-color .15s ease}
.opt:hover{border-color:#CFCFCF}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--ink);background:var(--white)}
.opt .mk{width:22px;height:22px;flex:none;margin-top:1px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.opt.box .mk{border-radius:7px}
.opt[aria-pressed="true"] .mk,.opt[aria-checked="true"] .mk{background:var(--blue);border-color:var(--blue)}
.opt .t{display:flex;flex-direction:column;gap:3px}
.opt .t small{font-size:13px;color:var(--grey)}
.reply{font-size:14px;border-radius:14px;padding:10px 14px;margin-top:4px}
.reply.ok{background:#E9FBF2;color:#14613F}
.reply.no{background:var(--warn-bg);color:var(--warn)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px;margin-top:auto}

/* result */
.res{flex:1;min-height:0;overflow:auto;width:100%;max-width:640px;margin:0 auto;padding:0 22px 22px;display:flex;flex-direction:column;gap:16px}
.res h2{font-size:clamp(26px,3vw,36px);line-height:1.1;font-weight:800;letter-spacing:-.035em}
.res .lead{color:var(--grey);font-size:16px}
.res .art{height:140px;display:flex;justify-content:center}
.res .art svg{height:100%;width:auto}
.sum{border-radius:20px;background:var(--soft);padding:6px 16px}
.sum .r{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.sum .r:first-child{border-top:0}
.sum .r span:first-child{color:var(--grey)}
.sum .r span:last-child{text-align:right;font-weight:600}
.miss{display:flex;flex-direction:column;gap:8px}
.miss li{list-style:none;border-radius:16px;padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-size:15px}
.miss{padding:0}
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:13px;font-weight:600;color:var(--grey)}
.form input{height:50px;border-radius:14px;border:0;background:var(--soft);padding:0 14px;font-size:16px;width:100%}
.form textarea{border-radius:14px;border:0;background:var(--soft);padding:12px 14px;font-size:16px;width:100%;min-height:96px;resize:vertical}
.form textarea:focus,.form input:focus{outline:2px solid var(--blue);outline-offset:1px}
.form .f{display:flex;flex-direction:column;gap:6px}
.sent{border-radius:16px;background:#E9FBF2;color:#14613F;padding:14px 16px;font-size:15px}
.draft{font-size:12px;color:var(--grey);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="stage">
  <div class="app" id="app"></div>
</div>

<script>
(() => {
  /* ---------- drawings: flat blue with black outlines (simple originals, placeholders for illustration) ---------- */
  const SP = (x,y,r) => `<path d="M${x} ${y-r}L${x+r*.28} ${y-r*.28}L${x+r} ${y}L${x+r*.28} ${y+r*.28}L${x} ${y+r}L${x-r*.28} ${y+r*.28}L${x-r} ${y}L${x-r*.28} ${y-r*.28}Z" fill="#111111"/>`;
  const svg = (inner, vb='0 0 200 200') => `<svg viewBox="${vb}" fill="none" stroke="#111111" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
  const ART = {
    home: svg(`
      <rect x="40" y="60" width="96" height="120" rx="14" fill="#FFFFFF" transform="rotate(-8 88 120)"/>
      <rect x="70" y="40" width="96" height="120" rx="14" fill="#FFFFFF" transform="rotate(5 118 100)"/>
      <path d="M90 74h46M90 90h46M90 106h30" transform="rotate(5 118 100)"/>
      <circle cx="146" cy="150" r="30" fill="#3DDC97"/><path d="M132 150l10 10 18-20" stroke-width="5"/>
      <path d="M22 132c10-6 22-6 30 2l18 18c6 6 4 16-4 20l-18 8c-10 4-22 0-28-8z" fill="#2F5BFF"/>
      <circle cx="40" cy="44" r="10" fill="#F2A9A0"/>${SP(176,40,10)}${SP(28,90,7)}`),
    you: svg(`
      <path d="M36 80h128v96H36z" fill="#FFFFFF"/>
      <path d="M28 52h144l-8 28H36z" fill="#2F5BFF"/>
      <path d="M52 52l-6 28M76 52l-2 28M100 52v28M124 52l2 28M148 52l6 28" stroke="#FFFFFF"/>
      <path d="M28 52h144l-8 28H36z"/>
      <rect x="52" y="100" width="42" height="34" rx="6" fill="#F2A9A0"/>
      <rect x="110" y="104" width="34" height="72" rx="6" fill="#2F5BFF"/><circle cx="136" cy="142" r="3" fill="#FFFFFF" stroke="none"/>
      ${SP(176,30,9)}`),
    need: svg(`
      <rect x="28" y="44" width="62" height="62" rx="8" fill="#2F5BFF" transform="rotate(-8 59 75)"/>
      <path d="M40 64h34M40 76h26" stroke="#FFFFFF" transform="rotate(-8 59 75)"/>
      <rect x="110" y="62" width="62" height="62" rx="8" fill="#3DDC97" transform="rotate(7 141 93)"/>
      <path d="M122 84h34M122 96h22" transform="rotate(7 141 93)"/>
      <rect x="62" y="122" width="62" height="56" rx="8" fill="#F2A9A0" transform="rotate(-3 93 150)"/>
      <path d="M74 142h34M74 154h20" transform="rotate(-3 93 150)"/>${SP(170,40,9)}`),
    believe: svg(`
      <rect x="46" y="46" width="108" height="108" rx="26" fill="#2F5BFF"/>
      <path d="M74 102l18 18 36-40" stroke="#FFFFFF" stroke-width="9"/>
      <path d="M150 156c6-10 18-10 22 0c4 10-10 18-22 26c-12-8-26-16-22-26c4-10 16-10 22 0z" fill="#F2A9A0" transform="translate(-10 -6) scale(.9)"/>
      ${SP(36,44,10)}${SP(168,48,7)}`),
    work: svg(`
      <rect x="34" y="46" width="132" height="122" rx="14" fill="#FFFFFF"/>
      <rect x="34" y="46" width="132" height="32" rx="14" fill="#2F5BFF"/>
      <path d="M66 36v20M134 36v20"/>
      ${[0,1,2,3].map(r=>[0,1,2,3,4].map(c=>`<circle cx="${56+c*22}" cy="${98+r*18}" r="2.8" fill="#111111" stroke="none"/>`).join('')).join('')}
      <ellipse cx="100" cy="116" rx="15" ry="12" stroke="#3DDC97" stroke-width="4"/>${SP(174,40,9)}`),
    budget: svg(`
      <path d="M52 30h96v140l-12-8-12 8-12-8-12 8-12-8-12 8-12-8-12 8z" fill="#FFFFFF"/>
      <circle cx="100" cy="72" r="22" fill="#2F5BFF"/>
      <path d="M106 63c-3-3-12-3-12 3s12 4 12 10-9 6-12 3M100 58v4M100 82v4" stroke="#FFFFFF"/>
      <path d="M70 112h60M70 126h44M70 140h52"/>${SP(170,46,9)}${SP(30,120,7)}`),
    terms: svg(`
      <rect x="44" y="30" width="96" height="134" rx="8" transform="rotate(-6 92 97)" fill="#FFFFFF"/>
      <path d="M62 56h56M62 70h56M62 84h40M62 98h50" transform="rotate(-6 92 97)"/>
      <path d="M64 136c8-14 14 6 22-6s10 8 18-2 8 6 14 0" stroke="#2F5BFF" stroke-width="4" transform="rotate(-6 92 97)"/>
      <path d="M128 168l40-62 12 8-40 62-16 6z" fill="#2F5BFF"/><path d="M160 118l12 8"/>${SP(170,40,9)}`),
    yes: svg(`
      <circle cx="100" cy="100" r="62" fill="#3DDC97"/><path d="M72 102l20 20 38-42" stroke-width="8"/>
      <circle cx="44" cy="48" r="10" fill="#F2A9A0"/><circle cx="160" cy="160" r="8" fill="#2F5BFF"/>
      ${SP(166,44,12)}${SP(36,150,9)}${SP(150,76,6)}`),
    no: svg(`
      <circle cx="100" cy="100" r="62" fill="#FFFFFF"/><path d="M76 92c0-16 48-16 48 0M78 124c10 8 34 8 44 0" />
      <circle cx="80" cy="80" r="4" fill="#111111"/><circle cx="120" cy="80" r="4" fill="#111111"/>
      <rect x="128" y="120" width="44" height="44" rx="10" fill="#F2A9A0" transform="rotate(10 150 142)"/>
      ${SP(46,46,9)}`)
  };

  /* ---------- the fit check (facts from the Studio Website Brief; answer wording is a draft for Eli) ---------- */
  const SECTIONS = ['About you','What you need','What we believe','How we work','Budget','The terms'];
  const Q = [
    { id:'kind', sec:0, art:'you', type:'one', title:'What kind of food business do you run?',
      opts:[['Restaurant or restaurant group'],['Catering'],['Food brand or product'],['Cafe'],['Venue or hospitality'],["It's not a food business",'',true]],
      no:"We work only with food businesses, so we're probably not the right team for this one." },
    { id:'size', sec:0, art:'you', type:'one', title:'Roughly what does the business bring in a year?', help:'A ballpark is fine.',
      opts:[['Under $1M','',true],['$1M to $3M','',true],['$3M to $10M'],['Over $10M']],
      no:'We work best with food businesses doing $3M+ a year.' },
    { id:'need', sec:1, art:'need', type:'many', title:'What do you need help with?', help:'Pick everything that applies.',
      opts:[['Our message','What we stand for, and how we say it'],['A new look','Logo and visual identity'],['Packaging'],['Menus and in-store materials'],['Website'],['Campaigns and ads'],["Not sure yet","That's often the best place to start"]] },
    { id:'believe', sec:2, art:'believe', type:'all', title:'Working with us assumes you believe:', help:'Tick each one you agree with.',
      opts:[["As the founder, you can't build two successful brands at once."],['The right eyeballs over the number of eyeballs.']],
      no:"Working with us assumes you share these beliefs." },
    { id:'message', sec:3, art:'work', type:'one', title:'Month one is the message. No design until it’s signed off. Does that work for you?',
      opts:[['Yes, that makes sense'],["I'd rather start with design",'',true]],
      no:'Every engagement starts with the message, even if you came for a logo or a set of ads.' },
    { id:'when', sec:3, art:'work', type:'one', title:'When would you like to start?',
      opts:[['Within the next month'],['In one to three months'],['Later this year'],['We need it in the next two weeks','',true]],
      no:'The sprint takes three months, and same-day turnaround is not part of the service.' },
    { id:'signoff', sec:3, art:'work', type:'one', title:'Can someone reply within 3 to 5 business days and sign off each step?',
      opts:[["Yes, that's me"],['Yes, someone on my team'],['Probably not','',true]],
      no:'Each step needs replies within 3 to 5 business days and one named person to sign off.' },
    { id:'budget', sec:4, art:'budget', type:'one', title:'Every engagement starts with the 3-Month Brand Sprint at $24,000. Is that in range?',
      opts:[["Yes, that's in range"],["It's a stretch, but it's worth it"],['Not right now','',true]],
      no:'The sprint is $24,000, and every engagement starts with it.' },
    { id:'pay', sec:4, art:'budget', type:'one', title:'How would you prefer to pay?',
      opts:[['3 monthly payments of $8,000'],['50% to start, 50% at the end of month 3']] },
    { id:'terms', sec:5, art:'terms', type:'all', title:'A few terms to agree on', help:'Tick each one.',
      opts:[['The fee covers the full sprint, even if we finish early.'],['Payments are non-refundable.'],['Final approved work is yours once the sprint is paid in full.'],["We work 9:00 AM to 5:00 PM, closed on Shabbos and Jewish holidays."]],
      no:'Working together means agreeing to these terms up front.' }
  ];

  /* ---------- state ---------- */
  const st = { view:'home', i:0, ans:{}, sent:false, noteSent:false, seen:new Set() };
  Q.forEach(q => st.ans[q.id] = q.type === 'one' ? null : q.opts.map(()=>false));

  const answered = q => q.type === 'one' ? st.ans[q.id] !== null : q.type === 'many' ? st.ans[q.id].some(Boolean) : true;
  const misfit = q => q.type === 'one' ? (st.ans[q.id] !== null && !!q.opts[st.ans[q.id]][2]) : q.type === 'all' ? !st.ans[q.id].every(Boolean) : false;
  const misses = () => Q.filter(q => st.seen.has(q.id) && misfit(q));
  const pick = q => q.type === 'one' ? (st.ans[q.id] === null ? '-' : q.opts[st.ans[q.id]][0]) : q.opts.filter((o,k)=>st.ans[q.id][k]).map(o=>o[0]).join(', ') || '-';

  /* ---------- views ---------- */
  const bar = (right='') => `<div class="bar"><button class="mark" data-act="home" aria-label="itseli home"><i>it</i>itseli</button>${right}</div>`;

  function home(){
    return `${bar('<span class="meta" style="font-size:14px;color:#6B6B6B">For food founders</span>')}
      <section class="home">
        <div>
          <h1>In a world of AI, the only thing you own is your message.</h1>
          <p class="sub">Let's see if we're a fit. A few quick questions about your business, our beliefs, timing, budget and terms.</p>
          <div class="ctas"><button class="btn" data-act="start">Let's get started ${arrow}</button><span class="meta">About 3 minutes. Tap to answer.</span></div>
          <div class="what" aria-label="What the questions cover">${SECTIONS.map(s=>`<span>${s}</span>`).join('')}</div>
        </div>
        <div class="art">${ART.home}</div>
      </section>`;
  }
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  function question(){
    const q = Q[st.i];
    const secDone = s => { const qs = Q.filter(x=>x.sec===s); const idx = Q.indexOf(q); const before = qs.filter(x=>Q.indexOf(x) < idx).length + (qs.includes(q) ? (answered(q)?1:0) : 0); return Math.min(1, before / qs.length); };
    const v = st.ans[q.id];
    const isOn = k => q.type === 'one' ? v === k : v[k];
    const role = q.type === 'one' ? 'aria-pressed' : 'aria-checked';
    const showNo = misfit(q) && (q.type === 'one' || (q.type === 'all' && v.some(Boolean) && !v.every(Boolean)));
    const okMsg = q.type === 'all' && v.every(Boolean) ? 'Thank you. That matters more than anything else on this list.' : '';
    return `${bar(`<button class="link" data-act="home">Exit</button>`)}
      <section class="q" aria-live="polite">
        <div class="prog" aria-label="Progress">${SECTIONS.map((s,k)=>`<i title="${s}"><b style="transform:scaleX(${secDone(k)})"></b></i>`).join('')}</div>
        <div class="sec"><span>${SECTIONS[q.sec]}</span><span>Question ${st.i+1} of ${Q.length}</span></div>
        <div class="qart">${ART[q.art]}</div>
        <h2>${q.title}</h2>
        ${q.help ? `<p class="help">${q.help}</p>` : ''}
        <div class="opts" role="${q.type==='one'?'radiogroup':'group'}" aria-label="${q.title}">
          ${q.opts.map((o,k)=>`<button class="opt ${q.type==='one'?'':'box'}" data-act="ans" data-k="${k}" ${q.type==='one'?'role="radio"':'role="checkbox"'} ${role}="${!!isOn(k)}">
            <span class="mk" aria-hidden="true">${isOn(k)?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>':''}</span>
            <span class="t"><span>${o[0]}</span>${o[1]?`<small>${o[1]}</small>`:''}</span></button>`).join('')}
          ${showNo ? `<p class="reply no">${q.no} You can keep going, and we'll show you where things stand at the end.</p>` : ''}
          ${okMsg ? `<p class="reply ok">${okMsg}</p>` : ''}
        </div>
        <div class="foot">
          <button class="btn ghost" data-act="back">Back</button>
          <button class="btn" data-act="next" ${answered(q)?'':'disabled'}>${st.i === Q.length-1 ? 'See where we stand' : 'Next'} ${arrow}</button>
        </div>
      </section>`;
  }

  function result(){
    const m = misses();
    const fit = m.length === 0;
    const sum = Q.filter(q=>q.id!=='believe'&&q.id!=='terms').map(q=>`<div class="r"><span>${{kind:'Business',size:'Yearly revenue',need:'Help with',message:'Message first',when:'Start',signoff:'Sign-off',budget:'Budget',pay:'Payment'}[q.id]}</span><span>${pick(q)}</span></div>`).join('');
    if (fit) return `${bar()}
      <section class="res" aria-live="polite">
        <div class="art">${ART.yes}</div>
        <h2>We're aligned.</h2>
        <p class="lead">You share how we work: the beliefs, the timing, the budget and the terms. That's exactly who we do our best work with.</p>
        <div class="sum">${sum}<div class="r"><span>Beliefs and terms</span><span>All agreed</span></div></div>
        ${st.sent ? `<p class="sent">Thanks. The team will be in touch to set up a first conversation. (Prototype: nothing was sent.)</p>` : `
        <form class="form" id="contact" novalidate>
          <div class="f"><label for="c-name">Your name</label><input id="c-name" autocomplete="name" placeholder="Jane Cohen"></div>
          <div class="f"><label for="c-biz">Business</label><input id="c-biz" autocomplete="organization" placeholder="The name customers know you by"></div>
          <div class="f"><label for="c-email">Email</label><input id="c-email" type="email" autocomplete="email" placeholder="you@yourbusiness.com"></div>
          <button class="btn" type="submit" style="align-self:flex-start">Send to the team ${arrow}</button>
        </form>`}
        <p class="draft">Answer wording is a draft for Eli. Next phase: agreement, invoice and schedule.</p>
      </section>`;
    return `${bar()}
      <section class="res" aria-live="polite">
        <div class="art">${ART.no}</div>
        <h2>We might not be the right fit right now.</h2>
        <p class="lead">That's not a bad thing. Here's where things didn't line up:</p>
        <ul class="miss">${m.map(q=>`<li>${q.no}</li>`).join('')}</ul>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-act="review">Review my answers</button></div>
        <h3 style="margin:10px 0 0;font-size:20px;font-weight:800;letter-spacing:-.02em">Still want to reach out? Send us a note.</h3>
        <p class="lead" style="margin-top:-8px">We read every one. Your answers come with it, so you don't have to explain twice.</p>
        ${st.noteSent ? `<p class="sent">Thanks. Your note and your answers are with the team. (Prototype: nothing was sent.)</p>` : `
        <form class="form" id="note" novalidate>
          <div class="f"><label for="n-name">Your name</label><input id="n-name" autocomplete="name" placeholder="Jane Cohen"></div>
          <div class="f"><label for="n-biz">Business</label><input id="n-biz" autocomplete="organization" placeholder="The name customers know you by"></div>
          <div class="f"><label for="n-email">Email</label><input id="n-email" type="email" autocomplete="email" placeholder="you@yourbusiness.com"></div>
          <div class="f"><label for="n-msg">Your note</label><textarea id="n-msg" placeholder="Anything you'd like us to know"></textarea></div>
          <button class="btn" type="submit" style="align-self:flex-start">Send note ${arrow}</button>
        </form>`}
      </section>`;
  }

  /* ---------- render + events ---------- */
  const app = document.getElementById('app');
  function render(focusSel){
    app.innerHTML = st.view === 'home' ? home() : st.view === 'q' ? question() : result();
    const el = focusSel ? app.querySelector(focusSel) : app.querySelector('h1, h2');
    if (el) { if (!el.hasAttribute('tabindex') && !/BUTTON|INPUT/.test(el.tagName)) el.setAttribute('tabindex','-1'); el.focus({ preventScroll:true }); }
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'home') { st.view = 'home'; render(); }
    else if (a === 'start') { st.view = 'q'; render(); }
    else if (a === 'review') { st.view = 'q'; st.i = 0; render(); }
    else if (a === 'back') { if (st.i === 0) st.view = 'home'; else st.i--; render(); }
    else if (a === 'next') {
      const q = Q[st.i];
      if (!answered(q)) return;
      st.seen.add(q.id);
      if (st.i < Q.length - 1) st.i++; else st.view = 'res';
      render();
    }
    else if (a === 'ans') {
      const q = Q[st.i], k = +b.dataset.k;
      if (q.type === 'one') st.ans[q.id] = k; else st.ans[q.id][k] = !st.ans[q.id][k];
      render(`[data-act="ans"][data-k="${k}"]`);
    }
  });
  document.addEventListener('submit', e => {
    if (e.target.id === 'contact') { e.preventDefault(); st.sent = true; render(); }
    if (e.target.id === 'note') { e.preventDefault(); st.noteSent = true; render(); }
  });
  render();
})();
</script>

</body>
</html>
